<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; margin: 0; font-family: "Segoe UI", Roboto, sans-serif; font-size: 13px; color: #1a1a1a; }
    header { background: #6e0ad6; color: #fff; padding: 12px 14px; font-weight: 900; font-size: 18px; }
    header span { color: #f28000; }
    main { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
    label { font-weight: 700; font-size: 12px; color: #555; display: block; margin-bottom: 4px; }
    input, textarea { width: 100%; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; padding: 8px; font: inherit; }
    textarea { height: 52px; resize: vertical; }
    button { background: #6e0ad6; color: #fff; border: 0; border-radius: 6px; padding: 9px; font-weight: 800; cursor: pointer; }
    .st { background: #f5f5f7; border-radius: 6px; padding: 8px 10px; line-height: 1.5; }
    a { color: #6e0ad6; font-weight: 700; }
    .chk { display: flex; gap: 8px; align-items: flex-start; font-weight: 600; color: #1a1a1a; font-size: 13px; }
    .chk input { width: auto; margin-top: 2px; }
    .chk small { display: block; color: #777; font-weight: 400; }
    .sec { background: transparent; color: #6e0ad6; border: 1.5px solid #6e0ad6; }
  </style>
</head>
<body>
  <header>ofertazera<span>.</span></header>
  <main>
    <div class="st" id="st">Carregando…</div>
    <div><label>Endereço do servidor</label><input id="server"></div>
    <label class="chk"><input type="checkbox" id="abrirAbas"><span>Abrir os canais sozinho<small>Mantém uma aba por canal num grupo “Ofertazera” recolhido.</small></span></label>
    <div><label>Canais monitorados (ID ou link, separados por vírgula)</label><textarea id="channels"></textarea></div>
    <button id="save">Salvar</button>
    <button id="abrir" class="sec">Abrir/conferir as abas agora</button>
    <a id="open" href="#" target="_blank">Abrir o app ↗</a>
  </main>
  <script src="popup.js"></script>
</body>
</html>
